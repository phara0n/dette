{% extends "base.html" %}
{% block title %}Nouvelle compensation — {{ friend.name }}{% endblock %}
{% block content %}

<div class="form-card">
    <div style="margin-bottom:1.5rem;text-align:center;">
        <span style="font-size:2rem;display:block;margin-bottom:0.2rem;">🔧</span>
        <h1>Nouvelle Compensation</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;">Enregistrer un service ou une bricole payée pour <strong>{{ friend.name }}</strong></p>
    </div>

    {% if error %}
    <div class="alert alert-error">
        <span>⚠️</span>
        <div>{{ error }}</div>
    </div>
    {% endif %}

    <form method="post" action="/friends/{{ friend.id }}/compensations">
        <!-- Qui a rendu le service -->
        <div class="form-group">
            <label class="form-label">Qui a rendu le service / payé ?</label>
            <div class="segmented-control">
                <input type="radio" id="borrower-mehdi" name="borrower" value="Mehdi" checked>
                <label for="borrower-mehdi">Mehdi</label>
                
                <input type="radio" id="borrower-faycal" name="borrower" value="Faycal">
                <label for="borrower-faycal">Faycal</label>
            </div>
        </div>

        <!-- Description -->
        <div class="form-group">
            <label class="form-label" for="description">Description du service</label>
            <input type="text" id="description" name="description" class="form-input" placeholder="Ex: Réparation PC, courses supermarché..." required autofocus>
        </div>

        <!-- Montant TND -->
        <div class="form-group">
            <label class="form-label" for="amount_tnd">Valeur du service (en TND)</label>
            <input type="number" id="amount_tnd" name="amount_tnd" class="form-input" step="0.001" min="0.001" placeholder="Ex: 45.000" required style="font-family:var(--font-mono);">
        </div>

        <!-- Date -->
        <div class="form-group">
            <label class="form-label" for="compensation_date">Date</label>
            <input type="date" id="compensation_date" name="compensation_date" class="form-input" value="{{ today }}" required>
        </div>

        <!-- Boutons d'action -->
        <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary" style="flex:1;">Enregistrer la compensation</button>
            <a href="/friends/{{ friend.id }}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
