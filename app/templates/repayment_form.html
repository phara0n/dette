{% extends "base.html" %}
{% block title %}Nouveau remboursement — {{ friend.name }}{% endblock %}
{% block content %}

<div class="form-card">
    <div style="margin-bottom:1.5rem;text-align:center;">
        <span style="font-size:2rem;display:block;margin-bottom:0.2rem;">💰</span>
        <h1>Nouveau Remboursement</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;">Enregistrer un remboursement versé à <strong>{{ friend.name }}</strong></p>
    </div>

    {% if error %}
    <div class="alert alert-error">
        <span>⚠️</span>
        <div>{{ error }}</div>
    </div>
    {% endif %}

    <form method="post" action="/friends/{{ friend.id }}/repayments">
        <div class="form-row">
            <!-- Qui a payé -->
            <div class="form-group">
                <label class="form-label">Qui a payé ?</label>
                <div class="segmented-control">
                    <input type="radio" id="paid-mehdi" name="paid_by" value="Mehdi" checked>
                    <label for="paid-mehdi">Mehdi</label>
                    
                    <input type="radio" id="paid-faycal" name="paid_by" value="Faycal">
                    <label for="paid-faycal">Faycal</label>
                </div>
            </div>

            <!-- Pour réduire la dette de qui -->
            <div class="form-group">
                <label class="form-label">Pour quelle dette ?</label>
                <div class="segmented-control">
                    <input type="radio" id="for-mehdi" name="borrower" value="Mehdi" checked>
                    <label for="for-mehdi">Mehdi</label>
                    
                    <input type="radio" id="for-faycal" name="borrower" value="Faycal">
                    <label for="for-faycal">Faycal</label>
                </div>
            </div>
        </div>

        <!-- Montant (TND) -->
        <div class="form-group">
            <label class="form-label" for="amount_tnd">Montant remboursé (en TND)</label>
            <input type="number" id="amount_tnd" name="amount_tnd" class="form-input" step="0.001" min="0.001" placeholder="Ex: 100.000" required autofocus style="font-family:var(--font-mono);">
        </div>

        <!-- Date -->
        <div class="form-group">
            <label class="form-label" for="repayment_date">Date du remboursement</label>
            <input type="date" id="repayment_date" name="repayment_date" class="form-input" value="{{ today }}" required>
        </div>

        <!-- Notes -->
        <div class="form-group">
            <label class="form-label" for="notes">Notes / Moyen de paiement <small style="color:var(--text-muted);">(optionnel)</small></label>
            <input type="text" id="notes" name="notes" class="form-input" placeholder="Ex: Virement bancaire, espèces, D17...">
        </div>

        <!-- Boutons d'action -->
        <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary" style="flex:1;">Enregistrer le remboursement</button>
            <a href="/friends/{{ friend.id }}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
